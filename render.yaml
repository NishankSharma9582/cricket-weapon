services:
  - type: web
    name: cricketweapon-store
    runtime: node
    plan: free
    buildCommand: npm install --prefix frontend && npm run build
    startCommand: node backend/server.js
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --openssl-legacy-provider
      - key: DB_LINK
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 5d
      - key: COOKIE_EXPIRE
        value: "5"
      - key: CLOUDINARY_NAME
        sync: false
      - key: API_KEY
        sync: false
      - key: API_SECRET
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false